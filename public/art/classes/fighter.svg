<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgF" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#2b2130"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="steelF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c8d1"/>
      <stop offset="0.6" stop-color="#7d828c"/>
      <stop offset="1" stop-color="#4a4f59"/>
    </linearGradient>
    <linearGradient id="crestF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0645c"/>
      <stop offset="1" stop-color="#8f2318"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgF)"/>
  <ellipse cx="48" cy="89" rx="32" ry="5.5" fill="#000000" opacity="0.5"/>

  <!-- planted sword at right -->
  <polygon points="79,16 82.5,21 82.5,62 75.5,62 75.5,21" fill="url(#steelF)" stroke="#0d0a10" stroke-width="1.4"/>
  <path d="M79,22 v38" stroke="#f2e8d5" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="71" y="62" width="16" height="3.4" rx="1.4" fill="#c9a227" stroke="#0d0a10" stroke-width="1.2"/>
  <rect x="77" y="65.4" width="4" height="8" fill="#4a3320" stroke="#0d0a10" stroke-width="1.1"/>
  <circle cx="79" cy="77" r="3" fill="#c9a227" stroke="#0d0a10" stroke-width="1.2"/>

  <!-- cuirass and shoulders -->
  <path d="M26,96 c-1,-22 4,-34 14,-38 h16 c10,4 15,16 14,38 z" fill="url(#steelF)" stroke="#0d0a10" stroke-width="1.6"/>
  <path d="M32,96 c-0.5,-16 2.5,-26 9,-30 M64,96 c0.5,-16 -2.5,-26 -9,-30" stroke="#f2e8d5" stroke-opacity="0.22" stroke-width="1.2" fill="none"/>
  <!-- blue sash with gold edge -->
  <path d="M37,60 L60,96 h-9 L30,74 c1,-6 3.5,-11 7,-14 z" fill="#274d8a" stroke="#0d0a10" stroke-width="1.2"/>
  <path d="M37.5,61 L60.5,95" stroke="#c9a227" stroke-opacity="0.8" stroke-width="1.2" fill="none"/>
  <!-- pauldrons -->
  <ellipse cx="27" cy="64" rx="10.5" ry="8.5" fill="url(#steelF)" stroke="#0d0a10" stroke-width="1.5"/>
  <ellipse cx="69" cy="64" rx="10.5" ry="8.5" fill="url(#steelF)" stroke="#0d0a10" stroke-width="1.5"/>
  <g fill="#c9a227">
    <circle cx="23" cy="61" r="1.4"/><circle cx="29" cy="59.5" r="1.4"/>
    <circle cx="67" cy="59.5" r="1.4"/><circle cx="73" cy="61" r="1.4"/>
  </g>

  <!-- great helm -->
  <path d="M33,58 v-20 a15,15 0 0 1 30,0 v20 c-4,3 -26,3 -30,0 z" fill="url(#steelF)" stroke="#0d0a10" stroke-width="1.6"/>
  <path d="M34,40 h28" stroke="#c9a227" stroke-width="2.6"/>
  <!-- T-slit visor -->
  <path d="M38,44 h20 v4 h-7 v10 h-6 v-10 h-7 z" fill="#0d0a10"/>
  <circle cx="45" cy="46.4" r="1.1" fill="#e8b054"/>
  <circle cx="51" cy="46.4" r="1.1" fill="#e8b054"/>
  <!-- red crest -->
  <path d="M42,17 c-3,-8 2,-13 6,-13 s9,5 6,13 c-2,-4 -10,-4 -12,0 z" fill="url(#crestF)" stroke="#0d0a10" stroke-width="1.2"/>
  <path d="M48,5 v9" stroke="#c9a227" stroke-width="1.6"/>
</svg>
