<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="furV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a685b"/>
      <stop offset="1" stop-color="#463a33"/>
    </linearGradient>
  </defs>
  <!-- rat head, three-quarter facing left, tail curl beneath -->
  <path d="M27,20 c-1,4 -6,7 -12,7 -5,0 -9,-3 -10.5,-6.5 C3.8,18 5,15 8,13.5 L12,11.5 C13,7.5 16.5,5 20.5,5 c4.6,0 8,3.2 8,7.4 0,1.8 -0.6,3.6 -1.5,5 z" fill="url(#furV)" stroke="#0d0a10" stroke-width="1.4"/>
  <!-- ear -->
  <circle cx="21.5" cy="9.5" r="4.4" fill="#5c4d42" stroke="#0d0a10" stroke-width="1.3"/>
  <circle cx="21.5" cy="9.8" r="2.3" fill="#b98f7e" opacity="0.8"/>
  <!-- snout shading + eye -->
  <path d="M4,20 c2,-2.5 5,-4 8.5,-4.6" stroke="#f2e8d5" stroke-opacity="0.35" stroke-width="1" fill="none"/>
  <circle cx="11.5" cy="15.5" r="1.7" fill="#c0392b"/>
  <circle cx="11" cy="15" r="0.6" fill="#f2e8d5" opacity="0.9"/>
  <!-- whiskers -->
  <g stroke="#f2e8d5" stroke-opacity="0.55" stroke-width="0.8">
    <path d="M4,19 L-0.5,17.5 M3.6,21 L-0.6,21.4 M4.4,23 L0.5,25"/>
  </g>
  <!-- buck teeth -->
  <rect x="4.6" y="21.4" width="1.8" height="2.6" rx="0.6" fill="#e8ddc4"/>
  <!-- tail -->
  <path d="M25,26 c3.5,1.5 5.5,-0.5 4,-3 -1,-1.8 -3.5,-1.6 -4.5,0" fill="none" stroke="#b98f7e" stroke-width="1.6" stroke-linecap="round"/>
</svg>
