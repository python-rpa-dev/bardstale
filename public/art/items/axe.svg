<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="steelA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ebf0"/>
      <stop offset="0.6" stop-color="#a9aeb8"/>
      <stop offset="1" stop-color="#6d727b"/>
    </linearGradient>
  </defs>
  <!-- haft diagonal -->
  <polygon points="6,30 8.4,27.6 22.6,11.4 20.2,9" fill="#5a4326" stroke="#0d0a10" stroke-width="1.2"/>
