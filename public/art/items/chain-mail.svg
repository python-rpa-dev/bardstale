<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="mailC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7bcc6"/>
      <stop offset="1" stop-color="#5f646d"/>
    </linearGradient>
    <pattern id="rings" width="4.4" height="4.4" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.7" fill="none" stroke="#0d0a10" stroke-opacity="0.55" stroke-width="0.9"/>
      <circle cx="1.6" cy="1.6" r="0.5" fill="#f2e8d5" opacity="0.35"/>
    </pattern>
  </defs>
  <!-- hauberk silhouette -->
  <path d="M8,9 c1.4,-3.4 3.6,-5 8,-5 s6.6,1.6 8,5 l-0.4,4 -2.2,0.6 v15 h-10.8 v-15 l-2.2,-0.6 z" fill="url(#mailC)" stroke="#0d0a10" stroke-width="1.3"/>
  <path d="M8,9 c1.4,-3.4 3.6,-5 8,-5 s6.6,1.6 8,5 l-0.4,4 -2.2,0.6 v15 h-10.8 v-15 l-2.2,-0.6 z" fill="url(#rings)"/>
  <!-- neck opening -->
  <path d="M12.4,4.6 c1.2,2.6 6,2.6 7.2,0 l-1,-0.8 c-1.4,1.6 -3.8,1.6 -5.2,0 z" fill="#141019"/>
  <!-- shoulder trim -->
  <path d="M7.8,13.4 h16.4" stroke="#c9a227" stroke-width="1.6"/>
  <path d="M7.8,13.4 h16.4" stroke="#0d0a10" stroke-opacity="0.5" stroke-width="0.5"/>
  <!-- hem band -->
  <rect x="9.4" y="26.4" width="13.2" height="2.2" fill="#8b9099" stroke="#0d0a10" stroke-width="1"/>
</svg>
