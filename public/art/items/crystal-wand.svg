<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="crystalCw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f0f5"/>
      <stop offset="1" stop-color="#5fa8bd"/>
    </linearGradient>
    <radialGradient id="glowCw" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd7d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fd7d0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- slim shaft -->
  <polygon points="6.2,27.8 4.2,25.8 18.6,11.4 20.6,13.4" fill="#4a3320" stroke="#0d0a10" stroke-width="1.1"/>
  <!-- gold binding bands -->
  <path d="M7.9,25.5 l-2.2,-2.2 M14.6,18.8 l-2.2,-2.2" stroke="#c9a227" stroke-width="2.4"/>
  <!-- gold collar at the crystal seat -->
  <circle cx="19.6" cy="12.4" r="1.7" fill="#c9a227" stroke="#0d0a10" stroke-width="0.9"/>

  <!-- faceted crystal head -->
  <circle cx="23" cy="11" r="9" fill="url(#glowCw)"/>
  <polygon points="23,4 28,11 23,18 18,11" fill="url(#crystalCw)" stroke="#0d0a10" stroke-width="1.2"/>
  <g stroke="#f2e8d5" stroke-opacity="0.5" stroke-width="0.8" fill="none">
    <path d="M23,4 L20.6,11 L23,18 M23,4 L25.4,11 L23,18"/>
  </g>
  <!-- spark at the tip -->
  <path d="M27.5,3.5 l0.6,1.4 1.4,0.6 -1.4,0.6 -0.6,1.4 -0.6,-1.4 -1.4,-0.6 1.4,-0.6 z" fill="#f2e8d5" opacity="0.9"/>
</svg>
