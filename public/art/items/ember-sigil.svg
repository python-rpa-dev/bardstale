<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="obsEs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c1a"/>
      <stop offset="1" stop-color="#0f0b0b"/>
    </linearGradient>
    <linearGradient id="flameEs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c063"/>
      <stop offset="1" stop-color="#e8722c"/>
    </linearGradient>
    <radialGradient id="glowEs" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a2b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- hanging cord and ring -->
  <path d="M16,1.4 v3.2" stroke="#7a5230" stroke-width="1.4"/>
  <circle cx="16" cy="5.6" r="1.8" fill="none" stroke="#c9a227" stroke-width="1.4"/>

  <!-- obsidian disc -->
  <circle cx="16" cy="18" r="11" fill="url(#obsEs)" stroke="#0d0a10" stroke-width="1.3"/>
  <circle cx="16" cy="18" r="9" fill="none" stroke="#c9a227" stroke-opacity="0.75" stroke-width="1"/>
  <g fill="#c9a227" opacity="0.8">
    <circle cx="9.6" cy="11.6" r="0.8"/><circle cx="22.4" cy="11.6" r="0.8"/>
    <circle cx="9.6" cy="24.4" r="0.8"/><circle cx="22.4" cy="24.4" r="0.8"/>
  </g>

  <!-- burning sigil -->
  <circle cx="16" cy="18" r="7.5" fill="url(#glowEs)"/>
  <path d="M16,10 c3,4 5,6.5 5,9.5 0,3.6 -2.2,6 -5,6 s-5,-2.4 -5,-6 c0,-2 1,-3.6 2.4,-5.2 0.4,1.4 1.2,2.2 2.6,2.7 -0.8,-2.2 -0.9,-4.4 0,-7 z" fill="url(#flameEs)"/>
  <path d="M16,15.5 c1.4,1.8 2.2,3 2.2,4.3 0,1.6 -1,2.7 -2.2,2.7 s-2.2,-1.1 -2.2,-2.7 c0,-1.3 0.8,-2.5 2.2,-4.3 z" fill="#f2e8d5" opacity="0.85"/>

  <!-- stray sparks -->
  <g fill="#f2913c" opacity="0.7">
    <circle cx="26.5" cy="8.5" r="0.8"/><circle cx="24" cy="5" r="0.6"/>
  </g>
</svg>
