<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="woodT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6540"/>
      <stop offset="1" stop-color="#4e3720"/>
    </linearGradient>
    <radialGradient id="orbT" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#9cc6ff"/>
      <stop offset="0.5" stop-color="#2e6fd8"/>
