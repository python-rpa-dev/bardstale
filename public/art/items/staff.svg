  <!-- orb -->
  <circle cx="21.3" cy="6.4" r="4.6" fill="url(#orbT)" stroke="#0d0a10" stroke-width="1.2"/>
  <circle cx="21.3" cy="6.4" r="5.9" fill="none" stroke="#6fa8ff" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="19.7" cy="4.8" r="1.1" fill="#f2e8d5" opacity="0.85"/>
