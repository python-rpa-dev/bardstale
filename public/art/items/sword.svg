  <rect x="7" y="20" width="18" height="3" rx="1.4" fill="#c9a227" stroke="#0d0a10" stroke-width="1.2"/>
  <path d="M8,21.5 h16" stroke="#8a6d1a" stroke-width="0.9"/>
