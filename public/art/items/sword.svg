<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="steelS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="0.5" stop-color="#b4b9c2"/>
      <stop offset="1" stop-color="#6d727b"/>
