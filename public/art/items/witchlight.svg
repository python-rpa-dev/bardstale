  <!-- orb -->
  <circle cx="16" cy="18" r="8" fill="url(#wl1)" stroke="#f2e8d5" stroke-opacity="0.55" stroke-width="1.1"/>
  <!-- inner glint -->
  <path d="M12,15 c-1,1.6 -1.2,3.4 -0.4,5.2" fill="none" stroke="#c8f2ea" stroke-opacity="0.7" stroke-width="1"/>
  <!-- iron collar -->
  <path d="M11.4,11.2 c1.4,-0.9 3,-1.3 4.6,-1.3 s3.2,0.4 4.6,1.3" fill="none" stroke="#565a63" stroke-width="1.6"/>
