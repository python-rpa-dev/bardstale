<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="wl1" cx="0.45" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#c8f2ea"/>
      <stop offset="0.5" stop-color="#4fb3a5"/>
      <stop offset="1" stop-color="#1d5c55"/>
    </radialGradient>
  </defs>
  <!-- cold rays -->
  <g stroke="#4fb3a5" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round">
    <path d="M16,2.6 v3"/>
    <path d="M6.4,7.8 l2.2,2.2"/>
    <path d="M25.6,7.8 l-2.2,2.2"/>
    <path d="M2.8,16 h3"/>
    <path d="M29.2,16 h-3"/>
  </g>
  <!-- iron hook -->
  <path d="M16,7.4 c0,-2 -1.6,-3.2 -3.2,-2.4" fill="none" stroke="#565a63" stroke-width="1.4" stroke-linecap="round"/>
  <!-- hanging chain link -->
