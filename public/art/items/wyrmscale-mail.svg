<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="mailWsm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6ea3"/>
      <stop offset="1" stop-color="#211f38"/>
    </linearGradient>
    <!-- wyrm scales: 4x3 tiles, offset rows -->
    <pattern id="scalesWsm" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="#211f38"/>
      <path d="M-2,0 a2,2 0 0 0 4,0 z M2,0 a2,2 0 0 0 4,0 z" fill="#4a5c8c" stroke="#0d0a10" stroke-opacity="0.6" stroke-width="0.6"/>
      <path d="M0,1.5 a2,2 0 0 0 4,0 z M-4,1.5 a2,2 0 0 0 4,0 z M4,1.5 a2,2 0 0 0 4,0 z" fill="#3c4b76" stroke="#0d0a10" stroke-opacity="0.6" stroke-width="0.6"/>
    </pattern>
  </defs>
  <!-- hauberk silhouette -->
  <path d="M8,9 c1.4,-3.4 3.6,-5 8,-5 s6.6,1.6 8,5 l-0.4,4 -2.2,0.6 v15 h-10.8 v-15 l-2.2,-0.6 z" fill="url(#mailWsm)" stroke="#0d0a10" stroke-width="1.3"/>
  <path d="M8,9 c1.4,-3.4 3.6,-5 8,-5 s6.6,1.6 8,5 l-0.4,4 -2.2,0.6 v15 h-10.8 v-15 l-2.2,-0.6 z" fill="url(#scalesWsm)"/>
  <!-- neck opening -->
  <path d="M12.4,4.6 c1.2,2.6 6,2.6 7.2,0 l-1,-0.8 c-1.4,1.6 -3.8,1.6 -5.2,0 z" fill="#141019"/>
  <!-- gold shoulder trim with rivets -->
  <path d="M7.8,13.4 h16.4" stroke="#c9a227" stroke-width="1.6"/>
  <path d="M7.8,13.4 h16.4" stroke="#0d0a10" stroke-opacity="0.5" stroke-width="0.5"/>
  <g fill="#f2c063">
    <circle cx="10.5" cy="13.4" r="0.7"/><circle cx="16" cy="13.4" r="0.7"/><circle cx="21.5" cy="13.4" r="0.7"/>
  </g>
  <!-- hem band -->
  <rect x="9.4" y="26.4" width="13.2" height="2.2" fill="#c9a227" stroke="#0d0a10" stroke-width="1"/>
</svg>
