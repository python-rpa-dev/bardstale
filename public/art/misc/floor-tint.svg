<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8">
  <rect width="8" height="8" fill="#17121d"/>
  <!-- flagstone seams at tile edges: seamless when tiled -->
  <path d="M0,0 L8,0 M0,0 L0,8" stroke="#f2e8d5" stroke-opacity="0.09" stroke-width="0.7"/>
  <rect x="1" y="1" width="6" height="6" fill="#f2e8d5" opacity="0.03"/>
  <!-- grit speckle -->
  <g fill="#f2e8d5" opacity="0.07">
    <circle cx="2.4" cy="3.1" r="0.35"/>
    <circle cx="5.6" cy="5.4" r="0.3"/>
    <circle cx="4.2" cy="1.8" r="0.25"/>
  </g>
  <g fill="#000000" opacity="0.28">
    <circle cx="6.3" cy="2.6" r="0.4"/>
    <circle cx="3.1" cy="6.2" r="0.35"/>
  </g>
</svg>
