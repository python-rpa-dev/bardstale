<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgAwt" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#2b211c"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="cloakAwt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a837c"/>
      <stop offset="0.65" stop-color="#2e2926"/>
      <stop offset="1" stop-color="#141019" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glowAwt" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#e8722c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e8722c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgAwt)"/>
  <circle cx="48" cy="52" r="42" fill="url(#glowAwt)"/>

  <!-- ash-grey habit, burned and tattered at the hem -->
  <path d="M48,12 C32,19 25,37 28,56 c1.5,10 -3,17 -6,25 l5,-3 4,6 4,-7 5,7 4,-8 6,8 6,-8 4,8 5,-7 4,7 4,-6 5,3 c-3,-8 -7.5,-15 -6,-25 3,-19 -4,-37 -20,-44 z" fill="url(#cloakAwt)" stroke="#0d0a10" stroke-opacity="0.7" stroke-width="1.5"/>
  <!-- inner hood shadow -->
  <path d="M48,23 c-9,5 -13,16 -11,26 0.7,4 3,7 5,9 h12 c2,-2 4.3,-5 5,-9 2,-10 -2,-21 -11,-26 z" fill="#0d0a10"/>
  <!-- eyes like banked coals -->
  <ellipse cx="43" cy="47" rx="3" ry="2" fill="#f2913c"/>
  <ellipse cx="53" cy="47" rx="3" ry="2" fill="#f2913c"/>
  <circle cx="43" cy="47" r="6" fill="#ff6a2b" opacity="0.35"/>
  <circle cx="53" cy="47" r="6" fill="#ff6a2b" opacity="0.35"/>

  <!-- cinder wisps and drifting ash -->
  <g stroke="#e8722c" stroke-opacity="0.4" stroke-width="1.2" fill="none">
    <path d="M20,40 c-4,-6 -2,-12 3,-15 M76,40 c4,-6 2,-12 -3,-15"/>
    <path d="M16,60 c-5,-2 -8,-7 -7,-12 M80,60 c5,-2 8,-7 7,-12"/>
  </g>
  <g fill="#b9b2aa" opacity="0.35">
    <circle cx="24" cy="24" r="1"/><circle cx="72" cy="18" r="0.8"/>
    <circle cx="14" cy="72" r="0.9"/><circle cx="84" cy="66" r="1"/>
  </g>

  <!-- cracked gold reliquary dangling below -->
  <path d="M48,59 v-3" stroke="#c9a227" stroke-opacity="0.6" stroke-width="1"/>
  <circle cx="48" cy="64" r="3.4" fill="none" stroke="#c9a227" stroke-width="1.6"/>
  <path d="M46.5,62 l2,3.5 M49.5,62.5 l-1,2" stroke="#f2913c" stroke-width="0.8"/>
