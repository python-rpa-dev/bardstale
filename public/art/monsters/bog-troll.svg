<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgBgt" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#202a22"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="skinBgt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8a5f"/>
      <stop offset="1" stop-color="#38402e"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgBgt)"/>
  <ellipse cx="48" cy="89" rx="36" ry="5.5" fill="#000000" opacity="0.5"/>

  <!-- mossy mountain of shoulders -->
  <path d="M10,96 c-2,-24 8,-38 24,-42 h28 c16,4 26,18 24,42 z" fill="url(#skinBgt)" stroke="#0d0a10" stroke-width="1.7"/>
  <!-- moss mantle and hanging lichen -->
  <path d="M12,72 q14,-14 32,-16 s18,2 28,9 c-10,4 -18,6 -28,6 s-22,-1 -32,1 z" fill="#4c7038" stroke="#0d0a10" stroke-width="1.1"/>
  <g stroke="#9ab06a" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M18,72 c-2,6 -2,12 0,18 M30,74 c-1,7 -1,13 1,19 M66,74 c1,7 1,13 -1,19 M78,72 c2,6 2,12 0,18"/>
  </g>

  <!-- pale fen fungi clustered on the shoulder -->
  <g stroke="#0d0a10" stroke-width="1">
    <path d="M23,64 v-5 h3 v5 z" fill="#d8cdb2"/>
    <path d="M31,61 v-4 h2.6 v4 z" fill="#d8cdb2"/>
  </g>
  <g fill="#b9c98f" stroke="#0d0a10" stroke-width="1.1">
    <path d="M17,59 q4.5,-6 9,0 z"/>
    <path d="M27,57 q3.5,-5 7,0 z"/>
    <path d="M24,64 q3,-4 6,0 z" fill="#a3b578"/>
  </g>

  <!-- small head sunk between the shoulders -->
  <path d="M48,26 c11,0 17,8 17,18 0,12 -8,20 -17,20 s-17,-8 -17,-20 c0,-10 6,-18 17,-18 z" fill="url(#skinBgt)" stroke="#0d0a10" stroke-width="1.7"/>
  <path d="M31,40 c5,-5 12,-6 17,-4 5,-2 12,-1 17,4 l-2,4 c-9,-4 -21,-4 -30,0 z" fill="#4a5238" stroke="#0d0a10" stroke-width="1.3"/>
  <circle cx="42" cy="46" r="2.2" fill="#c9a227" stroke="#0d0a10" stroke-width="0.8"/>
  <circle cx="54" cy="46" r="2.2" fill="#c9a227" stroke="#0d0a10" stroke-width="0.8"/>
  <!-- wide jaw with crossing tusks -->
  <path d="M34,54 q14,7 28,0 l-1,6 q-13,6 -26,0 z" fill="#38402e" stroke="#0d0a10" stroke-width="1.3"/>
  <path d="M36,58 c-1,7 -4,11 -8,13 l-1,-6 c3,-2 5,-4 6,-8 z M60,58 c1,7 4,11 8,13 l1,-6 c-3,-2 -5,-4 -6,-8 z" fill="#d8cdb2" stroke="#0d0a10" stroke-width="1.2"/>
</svg>
