<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgRat" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#2a212b"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="furRat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6a5c"/>
      <stop offset="1" stop-color="#41362f"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgRat)"/>
  <ellipse cx="48" cy="89" rx="32" ry="5.5" fill="#000000" opacity="0.5"/>

  <!-- tail curling behind -->
  <path d="M66,82 c14,4 24,-6 20,-18 -2.5,-7 -10,-8 -13,-2" fill="none" stroke="#b98f7e" stroke-width="3" stroke-linecap="round"/>

  <!-- hunched body -->
  <path d="M20,96 c-4,-20 2,-34 14,-40 h28 c12,6 18,20 14,40 z" fill="url(#furRat)" stroke="#0d0a10" stroke-width="1.7"/>
  <path d="M30,96 c-2,-14 0,-24 6,-30 M66,96 c2,-14 0,-24 -6,-30" fill="none" stroke="#f2e8d5" stroke-opacity="0.16" stroke-width="1.3"/>
  <!-- claws -->
  <g stroke="#e8ddc4" stroke-width="1.6" stroke-linecap="round">
    <path d="M30,94 l-2,-6 M35,95 v-7 M40,94 l2,-6"/>
    <path d="M56,94 l-2,-6 M61,95 v-7 M66,94 l2,-6"/>
  </g>

  <!-- ears -->
  <circle cx="33" cy="30" r="10.5" fill="#5c4d42" stroke="#0d0a10" stroke-width="1.5"/>
  <circle cx="33" cy="30.6" r="5.6" fill="#b98f7e" opacity="0.85"/>
  <circle cx="63" cy="28" r="9.5" fill="#5c4d42" stroke="#0d0a10" stroke-width="1.5"/>
  <circle cx="63" cy="28.6" r="5" fill="#b98f7e" opacity="0.85"/>

  <!-- head with pointed snout to the left -->
  <path d="M48,26 c12,0 19,9 19,20 0,13 -9,22 -19,22 -7,0 -12,-3 -16,-8 L16,52 l14,-12 c-1.5,-3 0,-14 18,-14 z" fill="url(#furRat)" stroke="#0d0a10" stroke-width="1.7"/>
  <path d="M17,52 L32,46 M17,52 l15,4" stroke="#0d0a10" stroke-opacity="0.4" stroke-width="1"/>
  <!-- whiskers -->
  <g stroke="#f2e8d5" stroke-opacity="0.55" stroke-width="1">
    <path d="M17,50 L3,44 M16,53 L1,53 M17,56 L4,62"/>
  </g>
  <!-- buck teeth -->
  <rect x="18.5" y="53" width="2.6" height="4" rx="0.9" fill="#e8ddc4" stroke="#0d0a10" stroke-width="0.8"/>
  <!-- eyes: diseased red -->
  <circle cx="37" cy="44" r="4.5" fill="#c0392b" opacity="0.3"/>
  <circle cx="57" cy="44" r="4.5" fill="#c0392b" opacity="0.3"/>
  <circle cx="37" cy="44" r="2.3" fill="#c0392b"/>
  <circle cx="57" cy="44" r="2.3" fill="#c0392b"/>
  <circle cx="36.2" cy="43.2" r="0.8" fill="#f2e8d5" opacity="0.9"/>
</svg>
