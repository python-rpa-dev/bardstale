<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgLic" cx="0.5" cy="0.4" r="0.85">
      <stop offset="0" stop-color="#1b2320"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="robeLic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4a44"/>
      <stop offset="1" stop-color="#161d1b"/>
    </linearGradient>
    <radialGradient id="phosLic" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#9fe8d2"/>
      <stop offset="0.6" stop-color="#4fb3a5"/>
      <stop offset="1" stop-color="#1c5a52" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgLic)"/>
  <ellipse cx="48" cy="89" rx="30" ry="5.5" fill="#000000" opacity="0.5"/>

  <!-- phosphor halo -->
  <circle cx="48" cy="34" r="21" fill="url(#phosLic)" opacity="0.28"/>

  <!-- hooded robe -->
  <path d="M30,96 c-1,-26 2,-42 10,-50 h16 c8,8 11,24 10,50 z" fill="url(#robeLic)" stroke="#0d0a10" stroke-width="1.7"/>
  <path d="M34,96 c0,-20 2,-34 7,-42 M62,96 c0,-20 -2,-34 -7,-42" stroke="#0f1514" stroke-opacity="0.6" stroke-width="1.2" fill="none"/>
  <!-- cowl -->
  <path d="M32,44 c-1,-14 6,-24 16,-24 10,0 17,10 16,24 -5,-4 -9,-6 -16,-6 -7,0 -11,2 -16,6 z" fill="#2a3531" stroke="#0d0a10" stroke-width="1.6"/>
  <!-- skull face in shadow -->
  <path d="M40,38 c0,-6 3.5,-10 8,-10 4.5,0 8,4 8,10 0,4 -1.5,7 -4,8.5 l-1,5 h-6 l-1,-5 c-2.5,-1.5 -4,-4.5 -4,-8.5 z" fill="#d8cdb2" stroke="#0d0a10" stroke-width="1.3"/>
  <ellipse cx="44.5" cy="37" rx="2.4" ry="2.6" fill="#0d0a10"/>
  <ellipse cx="51.5" cy="37" rx="2.4" ry="2.6" fill="#0d0a10"/>
  <circle cx="44.5" cy="37.4" r="1.1" fill="#9fe8d2"/>
  <circle cx="51.5" cy="37.4" r="1.1" fill="#9fe8d2"/>
  <path d="M46,46 h4 M45.5,49 h5" stroke="#0d0a10" stroke-width="1" stroke-linecap="round"/>

  <!-- skeletal hands raised -->
  <g fill="#d8cdb2" stroke="#0d0a10" stroke-width="1">
    <path d="M30,64 c-3,-4 -2,-9 2,-11 l5,7 z"/>
    <path d="M66,64 c3,-4 2,-9 -2,-11 l-5,7 z"/>
  </g>

  <!-- staff with phosphor skull -->
  <rect x="68" y="20" width="3.4" height="72" rx="1.7" fill="#4a3620" stroke="#0d0a10" stroke-width="1"/>
  <circle cx="69.7" cy="17" r="6" fill="url(#phosLic)" opacity="0.85"/>
  <g fill="#eafff8">
    <circle cx="67.6" cy="16" r="1.3"/>
    <circle cx="71.8" cy="16" r="1.3"/>
  </g>

  <!-- floating rune motes -->
  <g fill="#9fe8d2" opacity="0.75">
    <rect x="24" y="30" width="2.4" height="2.4" transform="rotate(45 25.2 31.2)"/>
    <rect x="76" y="44" width="2" height="2" transform="rotate(45 77 45)"/>
    <rect x="20" y="52" width="1.8" height="1.8" transform="rotate(45 20.9 52.9)"/>
  </g>
</svg>
