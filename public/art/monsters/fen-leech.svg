<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgFnl" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1f2a20"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="skinFnl" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#16281c"/>
      <stop offset="1" stop-color="#4f7a55"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgFnl)"/>
  <ellipse cx="48" cy="89" rx="30" ry="5.5" fill="#000000" opacity="0.5"/>

  <!-- mud pool the leech crawls from -->
  <ellipse cx="32" cy="87" rx="18" ry="4" fill="#22301c" opacity="0.85"/>
  <g stroke="#9fc98a" stroke-opacity="0.25" stroke-width="1" fill="none">
    <circle cx="24" cy="85" r="1.6"/>
    <circle cx="37" cy="87" r="1.1"/>
  </g>

  <!-- reared body, tail low-left to head high-right -->
  <path d="M18,86 C10,64 20,42 42,34 C58,28 72,31 79,40 L71,49 C65,43 55,41 46,45 C33,50 27,64 31,86 z" fill="url(#skinFnl)" stroke="#0d0a10" stroke-width="1.7"/>
  <!-- blood gut swelling along the belly -->
  <path d="M29,83 c-1,-15 5,-26 16,-31 7,-3 14,-2 19,2 l-3,4 c-5,-3 -11,-4 -16,-1 -9,4 -13,14 -12,25 z" fill="#4a1f22" opacity="0.55"/>
  <!-- segment grooves -->
  <g stroke="#0d0a10" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M25,76 l7,4 M28,63 l8,3 M35,51 l7,4 M46,43 l6,5 M57,38 l5,5"/>
  </g>
  <!-- slick top gleam -->
  <path d="M20,80 C14,60 24,44 42,38 C54,34 64,34 71,38" fill="none" stroke="#cfe8b8" stroke-opacity="0.22" stroke-width="1.3"/>

  <!-- sucker mouth at the snout tip -->
  <ellipse cx="77" cy="45" rx="3.2" ry="2.6" fill="#1c3524" stroke="#0d0a10" stroke-width="1.1"/>
  <circle cx="77" cy="45" r="1" fill="#9fc98a" opacity="0.6"/>
  <!-- pale eye -->
  <ellipse cx="67" cy="38" rx="2.6" ry="2.2" fill="#c9a227" stroke="#0d0a10" stroke-width="1"/>
  <circle cx="67.6" cy="38" r="0.9" fill="#141019"/>
  <!-- slime drips from the jaw -->
  <g stroke="#cfe8b8" stroke-opacity="0.3" stroke-width="1" fill="none">
    <path d="M74,50 c-1,3 -1,5 0,7 M69,51 c-1,2 -1,4 0,6"/>
  </g>
</svg>
