<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgFem" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0" stop-color="#1e2a16"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="abdFem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e7a2e"/>
      <stop offset="1" stop-color="#16260f"/>
    </linearGradient>
    <radialGradient id="sacFem" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#a8d15a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#a8d15a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowFem" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#7fbf3f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7fbf3f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgFem)"/>
  <!-- venom haze behind the queen -->
  <circle cx="48" cy="52" r="44" fill="url(#glowFem)"/>
  <!-- fouled webbing in the corners -->
  <g stroke="#9acd5a" stroke-opacity="0.1" stroke-width="1" fill="none">
    <path d="M0,12 C16,14 24,7 28,0 M0,28 C20,28 32,18 36,0 M0,44 C22,42 36,30 40,12"/>
    <path d="M96,12 C80,14 72,7 68,0 M96,28 C76,28 64,18 60,0 M96,44 C74,42 60,30 56,12"/>
  </g>
  <ellipse cx="48" cy="89" rx="40" ry="5.5" fill="#000000" opacity="0.5"/>

  <!-- eight long legs spanning the frame -->
  <g stroke="#2c3a22" stroke-width="4.2" fill="none" stroke-linecap="round">
    <path d="M36,47 L20,33 L11,48 L3,41"/>
    <path d="M35,54 L16,50 L7,63 L2,58"/>
    <path d="M37,61 L22,66 L15,80 L6,79"/>
    <path d="M40,68 L30,79 L27,90 L19,93"/>
    <path d="M60,47 L76,33 L85,48 L93,41"/>
    <path d="M61,54 L80,50 L89,63 L94,58"/>
    <path d="M59,61 L74,66 L81,80 L90,79"/>
    <path d="M56,68 L66,79 L69,90 L77,93"/>
  </g>
  <g stroke="#9acd5a" stroke-opacity="0.3" stroke-width="1.2" fill="none">
    <path d="M36,47 L20,33 L11,48 M60,47 L76,33 L85,48"/>
  </g>

  <!-- swollen poison abdomen -->
  <circle cx="48" cy="66" r="22" fill="url(#abdFem)" stroke="#0d0a10" stroke-width="1.7"/>
  <circle cx="48" cy="68" r="15" fill="url(#sacFem)"/>
  <!-- venom veins -->
  <g stroke="#9acd5a" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M48,47 l-3,10 5,7 -4,10 M36,56 l6,5 M60,54 l-5,7 M32,68 l7,2 M64,66 l-6,3"/>
  </g>

  <!-- cephalothorax and bone crown -->
  <circle cx="48" cy="41" r="13" fill="#3f5a26" stroke="#0d0a10" stroke-width="1.7"/>
  <g fill="#d8cdb2" stroke="#0d0a10" stroke-width="1">
    <polygon points="45.5,29 48,16 50.5,29"/>
    <polygon points="39,31 35,21 42,28"/>
    <polygon points="57,31 61,21 54,28"/>
  </g>

  <!-- sickly green eye cluster -->
  <circle cx="48" cy="39" r="11" fill="#7fbf3f" opacity="0.18"/>
  <g fill="#b7e05a" stroke="#0d0a10" stroke-width="0.7">
    <circle cx="44" cy="37" r="2.6"/><circle cx="52" cy="37" r="2.6"/>
    <circle cx="39" cy="41" r="1.7"/><circle cx="57" cy="41" r="1.7"/>
    <circle cx="45" cy="45" r="1.3"/><circle cx="51" cy="45" r="1.3"/>
  </g>

  <!-- dripping venom fangs -->
  <path d="M43,52 l-2,9 4,-6 z M53,52 l2,9 -4,-6 z" fill="#d8cdb2" stroke="#0d0a10" stroke-width="1"/>
  <g fill="#9acd5a">
    <circle cx="40.5" cy="65" r="1.3"/><circle cx="55.5" cy="66" r="1.1"/>
  </g>
  <path d="M41,62 v-2 M55,63 v-2" stroke="#9acd5a" stroke-opacity="0.7" stroke-width="0.8"/>
</svg>
