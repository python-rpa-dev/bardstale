<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgFsr" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#232031"/>
      <stop offset="1" stop-color="#120e18"/>
    </radialGradient>
    <linearGradient id="robeFsr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5a44"/>
      <stop offset="1" stop-color="#1f2418"/>
    </linearGradient>
    <radialGradient id="eyeFsr" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#efe3ff"/>
      <stop offset="0.55" stop-color="#9d7bd8"/>
      <stop offset="1" stop-color="#3d2a5c"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgFsr)"/>
  <ellipse cx="48" cy="89" rx="33" ry="5" fill="#000000" opacity="0.5"/>

  <!-- reed staff topped with a seer's eye-orb -->
  <path d="M18,90 L24,20 l3.4,0.6 -6,70 z" fill="#5c5142" stroke="#0d0a10" stroke-width="1.4"/>
  <circle cx="26" cy="16" r="8.5" fill="url(#eyeFsr)" stroke="#0d0a10" stroke-width="1.6"/>
  <circle cx="26" cy="16" r="3.2" fill="#1a1027"/>
  <circle cx="27.4" cy="14.4" r="1" fill="#ffffff" opacity="0.9"/>
  <!-- threads of fate drifting from the orb -->
  <g stroke="#9d7bd8" stroke-width="1" fill="none" opacity="0.7">
    <path d="M33,13 q12,-4 22,2"/>
    <path d="M33,18 q13,3 21,10"/>
  </g>

  <!-- hooded robed figure -->
  <path d="M22,96 c-1,-26 6,-44 26,-46 c20,2 27,20 26,46 z" fill="url(#robeFsr)" stroke="#0d0a10" stroke-width="1.7"/>
  <!-- deep hood -->
  <path d="M36,52 c0,-14 5,-22 12,-22 c7,0 12,8 12,22 c-4,-6 -7,-9 -12,-9 c-5,0 -8,3 -12,9 z" fill="#161a11" stroke="#0d0a10" stroke-width="1.5"/>
  <!-- shadowed face with two watching eyes -->
  <ellipse cx="48" cy="45" rx="7.5" ry="6" fill="#2a2436"/>
  <circle cx="45.2" cy="45" r="1.5" fill="#d9c8f5"/>
  <circle cx="50.8" cy="45" r="1.5" fill="#d9c8f5"/>
  <!-- withered hands raised over the mark -->
  <g fill="#a8ae8e" stroke="#0d0a10" stroke-width="1.1">
    <path d="M33,66 q-4,-6 1,-10 q5,-3 7,3 q1,5 -8,7 z"/>
    <path d="M63,66 q4,-6 -1,-10 q-5,-3 -7,3 q-1,5 8,7 z"/>
  </g>
  <!-- omen sigil floating over the chest -->
  <g stroke="#c9a227" stroke-width="1.6" fill="none" opacity="0.9">
    <path d="M41,72 h14 M48,66 v13 M43,68 l10,8 M53,68 l-10,8"/>
  </g>
  <!-- fen mist along the hem -->
  <g fill="#8fae9a" opacity="0.22">
    <ellipse cx="34" cy="90" rx="16" ry="3.4"/>
    <ellipse cx="63" cy="92" rx="14" ry="3"/>
  </g>
</svg>
