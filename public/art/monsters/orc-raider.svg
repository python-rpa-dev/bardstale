<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgOrc" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#2a2622"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="skinOrc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75836a"/>
      <stop offset="1" stop-color="#3c4a34"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgOrc)"/>
  <ellipse cx="48" cy="89" rx="34" ry="5.5" fill="#000000" opacity="0.5"/>

  <!-- raiding axe over the shoulder -->
  <polygon points="72,88 74.6,85.4 86,32 83.4,32" fill="#5a4326" stroke="#0d0a10" stroke-width="1.4"/>
  <path d="M80,34 c-4,-4 -3.5,-10 1.5,-13 5.5,-3.2 11,0.5 12,6 -2.7,-1.2 -5.4,-0.9 -7.2,0.6 2.1,0.5 3.7,1.7 4.6,3.4 -2.5,1.5 -5.3,1.6 -7.5,0.2 -0.6,1.4 -1.8,3.4 -3.4,2.8 z" fill="#8b9099" stroke="#0d0a10" stroke-width="1.3"/>
  <path d="M81.5,21 c5,-2.6 9.8,0.4 11,5.6" fill="none" stroke="#f2e8d5" stroke-opacity="0.55" stroke-width="1.1"/>

  <!-- massive leather-clad shoulders -->
  <path d="M16,96 c-1,-22 6,-34 18,-38 h28 c12,4 19,16 18,38 z" fill="#4a3b2e" stroke="#0d0a10" stroke-width="1.7"/>
  <path d="M24,66 L52,96 M72,66 L46,92" stroke="#33271c" stroke-width="4.5" fill="none"/>
  <rect x="44" y="78" width="8" height="6" rx="1.4" fill="#c9a227" stroke="#0d0a10" stroke-width="1.1"/>

  <!-- head sunk between shoulders -->
  <path d="M48,24 c13,0 20,9 20,20 0,14 -9,24 -20,24 s-20,-10 -20,-24 c0,-11 7,-20 20,-20 z" fill="url(#skinOrc)" stroke="#0d0a10" stroke-width="1.7"/>
  <!-- iron headband -->
  <path d="M29,36 c5,-8 33,-8 38,0 l-1.4,5 c-8,-5 -27.2,-5 -35.2,0 z" fill="#5a5f6b" stroke="#0d0a10" stroke-width="1.4"/>
  <g fill="#c9a227">
    <circle cx="36" cy="35.5" r="1.5"/><circle cx="48" cy="33.6" r="1.5"/><circle cx="60" cy="35.5" r="1.5"/>
  </g>
  <!-- brow ridge and small gold eyes -->
  <path d="M32,44 c6,-2 12,-1 15,1 M64,44 c-6,-2 -12,-1 -15,1" stroke="#28321f" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <circle cx="41" cy="47.5" r="2.4" fill="#c9a227" stroke="#0d0a10" stroke-width="0.9"/>
  <circle cx="55" cy="47.5" r="2.4" fill="#c9a227" stroke="#0d0a10" stroke-width="0.9"/>
  <!-- warpaint -->
  <path d="M36,52 l8,1 M52,53 l8,-1" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <!-- jutting tusks from the lower jaw -->
  <path d="M37,58 c-1,6 -3,10 -6,12 l-1,-6 c2,-2 3,-4 4,-7 z M59,58 c1,6 3,10 6,12 l1,-6 c-2,-2 -3,-4 -4,-7 z" fill="#e8ddc4" stroke="#0d0a10" stroke-width="1.2"/>
  <path d="M39,58 q9,6 18,0 l-1.5,4 q-7.5,3 -15,0 z" fill="#141019"/>
</svg>
