<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgSkl" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#2a2331"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="boneSkl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece2ca"/>
      <stop offset="1" stop-color="#9c9078"/>
    </linearGradient>
    <radialGradient id="soulSkl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b57ed6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8e44ad" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgSkl)"/>
  <ellipse cx="48" cy="89" rx="30" ry="5.5" fill="#000000" opacity="0.5"/>

  <!-- ribcage -->
  <g stroke-linecap="round">
    <path d="M48,62 v26" stroke="#b7ab90" stroke-width="3.5"/>
    <g fill="none" stroke="url(#boneSkl)" stroke-width="3.2">
      <path d="M48,66 c-8,-1 -13,2 -15,7 M48,66 c8,-1 13,2 15,7"/>
      <path d="M48,73 c-9,-1 -15,2 -17,7 M48,73 c9,-1 15,2 17,7"/>
      <path d="M48,80 c-8,0 -14,2.5 -16,7 M48,80 c8,0 14,2.5 16,7"/>
    </g>
    <!-- clavicles and shoulder stubs -->
    <path d="M36,60 L48,64 L60,60" fill="none" stroke="#d8cdb2" stroke-width="3"/>
    <circle cx="33" cy="59" r="3.4" fill="#d8cdb2" stroke="#0d0a10" stroke-width="1.2"/>
    <circle cx="63" cy="59" r="3.4" fill="#d8cdb2" stroke="#0d0a10" stroke-width="1.2"/>
  </g>

  <!-- skull -->
  <path d="M48,20 c11,0 17,7.5 17,16.5 0,5.5 -2,9 -4.5,11 l-0.8,5 c-0.3,2 -2,3.5 -4.2,3.5 h-15 c-2.2,0 -3.9,-1.5 -4.2,-3.5 l-0.8,-5 C33,45.5 31,42 31,36.5 31,27.5 37,20 48,20 z" fill="url(#boneSkl)" stroke="#0d0a10" stroke-width="1.7"/>
  <!-- sockets with soul-fire -->
  <circle cx="42" cy="36" r="6" fill="url(#soulSkl)"/>
  <circle cx="54" cy="36" r="6" fill="url(#soulSkl)"/>
  <ellipse cx="42" cy="36.4" rx="4.3" ry="3.7" fill="#0d0a10"/>
  <ellipse cx="54" cy="36.4" rx="4.3" ry="3.7" fill="#0d0a10"/>
  <circle cx="42.8" cy="36" r="1.4" fill="#b57ed6"/>
  <circle cx="53.2" cy="36" r="1.4" fill="#b57ed6"/>
  <!-- nasal + teeth -->
  <path d="M48,42 l-2.4,5 h4.8 z" fill="#0d0a10"/>
  <g stroke="#0d0a10" stroke-width="1">
    <rect x="39" y="52" width="18" height="6" rx="1.6" fill="#d8cdb2"/>
    <path d="M43.5,52.3 v5.4 M48,52.3 v5.4 M52.5,52.3 v5.4" stroke-width="0.9"/>
  </g>
  <!-- cranial crack -->
  <path d="M43,23 l1.6,2.6 -1.2,2" stroke="#0d0a10" stroke-opacity="0.55" stroke-width="1" fill="none"/>
</svg>
