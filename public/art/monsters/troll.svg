<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="bgTrl" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#262a21"/>
      <stop offset="1" stop-color="#141019"/>
    </radialGradient>
    <linearGradient id="skinTrl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a916d"/>
      <stop offset="1" stop-color="#3c4231"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#bgTrl)"/>
  <ellipse cx="48" cy="89" rx="36" ry="5.5" fill="#000000" opacity="0.5"/>

  <!-- sloping mountain of shoulders -->
  <path d="M10,96 c-2,-24 8,-38 24,-42 h28 c16,4 26,18 24,42 z" fill="url(#skinTrl)" stroke="#0d0a10" stroke-width="1.7"/>
  <path d="M20,96 c-1,-16 4,-28 13,-33 M76,96 c1,-16 -4,-28 -13,-33" fill="none" stroke="#f2e8d5" stroke-opacity="0.14" stroke-width="1.4"/>
  <!-- warts and coarse hair -->
  <g fill="#2c3322">
    <circle cx="26" cy="76" r="2"/><circle cx="34" cy="86" r="1.5"/>
    <circle cx="70" cy="78" r="2"/><circle cx="62" cy="88" r="1.5"/>
  </g>
  <g stroke="#1c2115" stroke-width="1.4" fill="none">
    <path d="M30,66 l-2,-4 M38,62 l-1,-4 M58,62 l1,-4 M66,66 l2,-4"/>
  </g>

  <!-- small head sunk between the shoulders -->
  <path d="M48,26 c11,0 17,8 17,18 0,12 -8,20 -17,20 s-17,-8 -17,-20 c0,-10 6,-18 17,-18 z" fill="url(#skinTrl)" stroke="#0d0a10" stroke-width="1.7"/>
  <!-- heavy brow ridge -->
  <path d="M31,40 c5,-5 12,-6 17,-4 5,-2 12,-1 17,4 l-2,4 c-9,-4 -21,-4 -30,0 z" fill="#4a5238" stroke="#0d0a10" stroke-width="1.3"/>
  <!-- deep-set gold eyes -->
  <circle cx="42" cy="46" r="2.2" fill="#c9a227" stroke="#0d0a10" stroke-width="0.8"/>
  <circle cx="54" cy="46" r="2.2" fill="#c9a227" stroke="#0d0a10" stroke-width="0.8"/>
  <!-- wide lower jaw with crossing tusks -->
  <path d="M34,54 q14,7 28,0 l-1,6 q-13,6 -26,0 z" fill="#3c4231" stroke="#0d0a10" stroke-width="1.3"/>
  <path d="M36,58 c-1,7 -4,11 -8,13 l-1,-6 c3,-2 5,-4 6,-8 z M60,58 c1,7 4,11 8,13 l1,-6 c-3,-2 -5,-4 -6,-8 z" fill="#d8cdb2" stroke="#0d0a10" stroke-width="1.2"/>
  <path d="M40,56 q8,4 16,0" fill="none" stroke="#0d0a10" stroke-opacity="0.7" stroke-width="2"/>
  <!-- bone necklace -->
  <g stroke="#d8cdb2" stroke-width="1.4">
    <path d="M38,68 l-1,5 M44,70 v5 M52,70 v5 M58,68 l1,5"/>
  </g>
</svg>
