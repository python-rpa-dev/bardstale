<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="faceA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3238"/>
      <stop offset="1" stop-color="#271f27"/>
    </linearGradient>
    <linearGradient id="faceB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#362b33"/>
      <stop offset="1" stop-color="#221a22"/>
    </linearGradient>
    <pattern id="brickfield" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#0d0a10"/>
      <!-- row 1: joints at x=0,32 -->
      <g>
        <rect x="1" y="1" width="30" height="13" rx="1.5" fill="url(#faceA)"/>
        <rect x="33" y="1" width="30" height="13" rx="1.5" fill="url(#faceB)"/>
      </g>
      <!-- row 2: joints at x=16,48 (wrap-around bricks clipped by tile edge) -->
      <g>
        <rect x="17" y="17" width="30" height="13" rx="1.5" fill="url(#faceB)"/>
        <rect x="49" y="17" width="16" height="13" rx="1.5" fill="url(#faceA)"/>
        <rect x="-15" y="17" width="30" height="13" rx="1.5" fill="url(#faceA)"/>
      </g>
      <!-- bevels: top highlight / bottom shadow per brick -->
      <g fill="#f2e8d5" opacity="0.10">
        <rect x="2" y="1.5" width="28" height="1.4"/>
        <rect x="34" y="1.5" width="28" height="1.4"/>
        <rect x="18" y="17.5" width="28" height="1.4"/>
        <rect x="0" y="17.5" width="13" height="1.4"/>
        <rect x="50" y="17.5" width="13" height="1.4"/>
      </g>
      <g fill="#000000" opacity="0.38">
        <rect x="2" y="12" width="28" height="2"/>
        <rect x="34" y="12" width="28" height="2"/>
        <rect x="18" y="28" width="28" height="2"/>
        <rect x="0" y="28" width="13" height="2"/>
        <rect x="50" y="28" width="13" height="2"/>
      </g>
    </pattern>
  </defs>

  <rect width="64" height="64" fill="#0d0a10"/>
  <rect width="64" height="64" fill="url(#brickfield)"/>

  <!-- weathering: faint mortar grime and speckle, kept subtle for tiling -->
  <g fill="#f2e8d5" opacity="0.05">
    <circle cx="9" cy="7" r="1"/>
    <circle cx="43" cy="24" r="0.8"/>
    <circle cx="26" cy="41" r="1"/>
    <circle cx="57" cy="55" r="0.8"/>
    <circle cx="14" cy="58" r="0.9"/>
  </g>
  <!-- hairline cracks -->
  <g stroke="#f2e8d5" stroke-opacity="0.10" stroke-width="0.7" fill="none">
    <path d="M36,4 l3,3 -1,4 2,3"/>
    <path d="M22,36 l-2,4 3,3"/>
  </g>
</svg>
