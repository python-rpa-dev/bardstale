<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="emberDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1513"/>
      <stop offset="1" stop-color="#0a0708"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#e8722c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8722c" stop-opacity="0"/>
    </radialGradient>
    <!-- obsidian shards: 32x16 courses, staggered joints -->
    <pattern id="obsShards" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#060405"/>
      <!-- row 1: joints at x=0,32 -->
      <polygon points="1.5,1.5 30.5,1 31,14.5 1,15" fill="#241b18"/>
      <polygon points="33.5,1 62.5,1.5 63,15 33,14.5" fill="#1b1312"/>
      <!-- row 2: joints at x=16,48 -->
      <polygon points="17.5,17.5 46.5,17 47,30.5 17,31" fill="#1b1312"/>
      <polygon points="49.5,17 63.5,17.2 64,31 49,30.5" fill="#241b18"/>
      <polygon points="-14.5,17 14.5,17.2 15,31 -15,30.5" fill="#241b18"/>
      <!-- glowing seams along the course joint -->
      <path d="M0,16 H64" stroke="#ff6a2b" stroke-opacity="0.28" stroke-width="3"/>
      <path d="M0,16 H64" stroke="#f2913c" stroke-opacity="0.75" stroke-width="1"/>
      <!-- molten vertical joints -->
      <g stroke="#f2913c" stroke-opacity="0.7" stroke-width="0.9">
        <path d="M32,1.8 L31.6,14 M16.4,17.8 L16,30 M48.4,17.8 L48,30"/>
      </g>
      <!-- glassy bevel highlights -->
      <g stroke="#f2e8d5" stroke-opacity="0.1" stroke-width="0.9">
        <path d="M2.5,2 L30,1.7 M34.5,1.7 L62,2 M18.5,17.7 L46,17.5"/>
      </g>
    </pattern>
  </defs>

  <rect width="64" height="64" fill="#0a0708"/>
  <rect width="64" height="64" fill="url(#obsShards)"/>
  <rect width="64" height="64" fill="url(#emberGlow)"/>

  <!-- chipped shard corners -->
  <g fill="#0a0708" opacity="0.9">
    <polygon points="31,2 33,1.5 32.5,4"/>
    <polygon points="17,17 19.5,16.5 19,19.5 16.5,19"/>
    <polygon points="47,30 48.5,28 49,31"/>
  </g>
  <!-- hairline cracks bleeding heat -->
  <g stroke="#ff6a2b" stroke-opacity="0.25" stroke-width="2.4" fill="none">
    <path d="M22,6 c1.5,3 -0.5,5 1,8 M40,20 c-1,3 0.5,5 -0.5,7 M52,4 c-1,2 0,4 1,6"/>
  </g>
  <g stroke="#f2913c" stroke-width="0.8" fill="none">
    <path d="M22,6 c1.5,3 -0.5,5 1,8 M40,20 c-1,3 0.5,5 -0.5,7 M52,4 c-1,2 0,4 1,6"/>
  </g>
  <!-- drifting embers -->
  <g fill="#f2913c" opacity="0.6">
    <circle cx="18" cy="27" r="0.8"/><circle cx="46" cy="11" r="0.7"/>
    <circle cx="30" cy="25" r="0.6"/><circle cx="58" cy="29" r="0.7"/>
  </g>
</svg>
