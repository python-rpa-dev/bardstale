<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fenDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c241a"/>
      <stop offset="1" stop-color="#0b0e08"/>
    </linearGradient>
    <radialGradient id="fenGlow" cx="0.5" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#7fbf3f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7fbf3f" stop-opacity="0"/>
    </radialGradient>
    <!-- revetment planks: 8px courses, seamless at x=0/32 and y edges -->
    <pattern id="fenTimber" width="32" height="64" patternUnits="userSpaceOnUse">
      <rect width="32" height="64" fill="#120f0a"/>
      <rect x="0.5" width="7" height="64" fill="#2a2519"/>
      <rect x="8.5" width="7" height="64" fill="#221d14"/>
      <rect x="16.5" width="7" height="64" fill="#262015"/>
      <rect x="24.5" width="7" height="64" fill="#1f1a12"/>
      <!-- wet wood grain -->
      <g stroke="#0d0a10" stroke-opacity="0.5" stroke-width="0.8" fill="none">
        <path d="M3,2 c1,10 -1,18 0,28 c-1,12 1,20 0,30"/>
        <path d="M12,4 c-1,9 1,17 0,26 c1,13 -1,21 0,30"/>
        <path d="M20,1 c1,11 -1,19 0,29 c-1,12 1,20 0,31"/>
        <path d="M28,5 c-1,10 1,18 0,27 c1,12 -1,20 0,28"/>
      </g>
      <!-- plank edge bevels -->
      <g stroke="#f2e8d5" stroke-opacity="0.07" stroke-width="0.9">
        <path d="M1.2,0 v64 M9.2,0 v64 M17.2,0 v64 M25.2,0 v64"/>
      </g>
      <!-- rot knots -->
      <g fill="#0d0a10" opacity="0.7">
        <ellipse cx="5" cy="22" rx="1.3" ry="2"/>
        <ellipse cx="21" cy="41" rx="1.1" ry="1.7"/>
      </g>
    </pattern>
  </defs>

  <rect width="64" height="64" fill="#0b0e08"/>
  <rect width="64" height="64" fill="url(#fenTimber)"/>
  <rect width="64" height="64" fill="url(#fenGlow)"/>

  <!-- moss creeping over the planks -->
  <g fill="#4c7038" opacity="0.5">
    <path d="M2,52 c4,-4 9,-5 13,-2 -2,6 -8,9 -13,7 z"/>
    <path d="M44,56 c5,-3 11,-3 15,1 -3,5 -10,7 -15,5 z"/>
    <path d="M22,44 c3,-2 7,-2 9,1 -2,4 -7,5 -9,3 z" opacity="0.7"/>
  </g>
  <!-- hanging moss strands from the top -->
  <g stroke="#5d8a4a" stroke-opacity="0.35" stroke-width="1" fill="none">
    <path d="M6,0 c-1,5 -1,9 1,13 M20,0 c1,4 1,8 -1,11 M40,0 c-1,6 -1,10 1,14 M56,0 c1,4 1,7 -1,10"/>
  </g>
  <!-- damp sheen low on the timber -->
  <g stroke="#9fc98a" stroke-opacity="0.06" stroke-width="1">
    <path d="M4,58 L28,59 M36,61 L60,60"/>
  </g>
  <!-- floating fen spores -->
  <g fill="#9acd5a" opacity="0.25">
    <circle cx="14" cy="18" r="0.8"/><circle cx="34" cy="10" r="0.7"/>
    <circle cx="52" cy="26" r="0.9"/><circle cx="28" cy="32" r="0.6"/>
  </g>
</svg>
